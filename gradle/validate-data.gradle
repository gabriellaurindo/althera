import groovy.json.JsonSlurper

class DataValidator {

    static final Set<String> RANKS = ['F', 'E', 'D', 'C', 'B', 'A', 'S', 'EX'] as Set
    static final Set<String> NATURES = ['COMMON', 'DIVINE'] as Set
    static final Set<String> NAMED_TARGETS = ['self', 'owner', 'target'] as Set

    static final Set<String> HERO_KEYS = ['name', 'description', 'class', 'rank', 'nature', 'model', 'texture',
            'animations', 'personality', 'scale', 'ultimate', 'attack', 'animation', 'stats', 'sounds', 'hitbox'] as Set
    static final Set<String> SOUNDS_KEYS = ['hurt', 'death', 'step'] as Set
    static final Set<String> HITBOX_KEYS = ['width', 'height'] as Set
    static final Set<String> ATTACK_KEYS = ['type', 'range', 'cooldown_ticks', 'shoot_frame', 'projectile_speed',
            'projectile_origin', 'projectile_trail', 'on_attack', 'on_hit'] as Set
    static final Set<String> ANIMATION_KEYS = ['attack_speed', 'attack_length', 'walk_speed', 'death_length'] as Set
    static final Set<String> STATS_KEYS = ['health', 'health_per_level', 'attack', 'attack_per_level', 'armor', 'armor_per_level', 'speed'] as Set
    static final Set<String> CLASS_KEYS = ['name', 'health', 'attack', 'armor', 'speed', 'knockback_resistance',
            'dodge_chance', 'strong_against'] as Set
    static final Set<String> ULTIMATE_KEYS = ['name', 'description', 'mana_cost', 'channel_ticks', 'cooldown_ticks',
            'on_start', 'on_tick', 'on_end'] as Set
    static final Set<String> SPELL_KEYS = ['name', 'player', 'range', 'cooldown_ticks', 'cast_ticks', 'on_cast', 'on_charge'] as Set
    static final Set<String> VISUAL_KEYS = ['texture', 'size', 'stretch', 'spin', 'glow', 'color'] as Set
    static final Set<String> TINTED_PARTICLES = ['althera:glow', 'althera:ember', 'althera:frost', 'althera:spark', 'althera:ring', 'althera:rune'] as Set
    static final Set<String> TINTED_PARTICLE_KEYS = ['type', 'color', 'scale', 'lifetime'] as Set
    static final Set<String> PLAYER_SPELL_KEYS = ['mana_cost', 'description', 'cast_mode', 'cooldown_ticks', 'proficiency'] as Set
    static final Set<String> PROFICIENCY_KEYS = ['damage_per_level', 'size_per_level', 'visual_per_level', 'cost_per_level'] as Set
    static final Set<String> CAST_MODES = ['instant', 'charge', 'continuous'] as Set
    static final Set<String> SPELL_NODE_KEYS = ['name', 'spell', 'parent', 'x', 'y', 'branch', 'element', 'tier'] as Set
    static final Set<String> QUEST_KEYS = ['title', 'giver', 'description', 'order', 'requires', 'tasks', 'rewards'] as Set
    static final Map<String, Set<String>> QUEST_TASKS = [
            discover_spell: ['node'] as Set,
            learn_spell   : ['node'] as Set,
            spell_level   : ['node', 'level'] as Set,
            kill          : ['entity', 'count', 'name'] as Set,
            item          : ['item', 'count', 'consume'] as Set,
            visit_academy : [] as Set,
    ]
    static final Map<String, Set<String>> QUEST_REWARDS = [
            invitation    : [] as Set,
            discover_spell: ['node', 'tier'] as Set,
            item          : ['item', 'count'] as Set,
    ]
    static final Set<String> TEACHER_KEYS = ['name', 'title', 'texture', 'position', 'yaw', 'greeting'] as Set
    static final Set<String> SPELL_BRANCHES = ['none', 'damage', 'defense', 'utility'] as Set
    static final Set<String> SPELL_ELEMENTS = ['none', 'fire', 'lightning', 'ice'] as Set
    static final Set<String> FILTER_KEYS = ['entity_tag', 'hostile', 'exclude_target'] as Set
    static final Set<String> ENEMY_MAGE_KEYS = ['name', 'faction', 'stats', 'spells', 'targets', 'servant', 'tiers',
            'command_seals', 'ultimate', 'home', 'loot_table'] as Set
    static final Set<String> ENEMY_STATS_KEYS = ['health', 'attack', 'armor', 'speed', 'follow_range', 'knockback_resistance', 'xp'] as Set
    static final Set<String> SERVANT_KEYS = ['ranks', 'heroes', 'stat_share', 'damage_share', 'recall_ticks', 'spirit_regen'] as Set
    static final Set<String> SPIRIT_REGEN_KEYS = ['amount', 'interval_ticks'] as Set
    static final Set<String> TIER_KEYS = ['level', 'texture', 'loot_table'] as Set
    static final Set<String> COMMAND_SEALS_KEYS = ['charges', 'heal', 'revive', 'overdrive'] as Set
    static final Set<String> HOME_KEYS = ['radius', 'respawn_ticks', 'activation_range'] as Set

    static final Map<String, Map<String, Boolean>> EFFECTS = [
            damage            : [target: true, filter: false, amount: false, attack_multiplier: false],
            knockback         : [target: true, filter: false, horizontal: false, vertical: false, scale_with_distance: false],
            ignite            : [target: true, filter: false, ticks: true],
            mob_effect        : [target: true, filter: false, effect: true, duration: true, amplifier: false, show_particles: false],
            explosion         : [power: false],
            particles         : [particle: true, count: false, spread: false, speed: false, height: false, line: false, direction_speed: false, circle: false],
            sound             : [sound: true, volume: false, pitch: false],
            dash              : [distance: true],
            heal              : [target: true, filter: false, amount: false, max_health_multiplier: false],
            projectile        : [count: false, spread: false, speed: false, amount: false, attack_multiplier: false, trail: false, on_hit: false, visual: false],
            lightning         : [:],
            chain             : [jumps: false, range: false, particle: false, on_jump: false],
            aura              : [target: false, filter: false, particle: true, duration: true, count: false, radius: false, height: false, bob: false, interval: false, turn: false, while_effect: false],
            ultimate_animation: [:]
    ]

    final File resources
    final List<String> errors = []

    DataValidator(File resources) {
        this.resources = resources
    }

    static String toId(String raw, boolean lowercase) {
        String value = lowercase ? raw.toLowerCase(Locale.ROOT) : raw
        return value.contains(':') ? value : "althera:${value}"
    }

    File dataFile(String id, String folder) {
        def (namespace, path) = id.split(':', 2)
        return new File(resources, "data/${namespace}/${folder}/${path}.json")
    }

    File assetFile(String id) {
        def (namespace, path) = id.split(':', 2)
        return new File(resources, "assets/${namespace}/${path}")
    }

    boolean isOurs(String id) {
        return id.startsWith('althera:')
    }

    void error(String where, String message) {
        errors << "${where}: ${message}".toString()
    }

    void checkKeys(String where, Map json, Set<String> allowed) {
        json.keySet().findAll { !allowed.contains(it) }.each { error(where, "unknown field '${it}'") }
    }

    void checkNumber(String where, Map json, String key, boolean required, Number min = null, Number max = null) {
        if (!json.containsKey(key)) {
            if (required) error(where, "missing '${key}'")
            return
        }
        def value = json[key]
        if (!(value instanceof Number)) {
            error(where, "'${key}' must be a number")
            return
        }
        if (min != null && value < min) error(where, "'${key}' must be at least ${min}")
        if (max != null && value > max) error(where, "'${key}' must be at most ${max}")
    }

    void checkVector(String where, Map json, String key) {
        if (!json.containsKey(key)) return
        def value = json[key]
        if (!(value instanceof List) || value.size() != 3 || value.any { !(it instanceof Number) }) {
            error(where, "'${key}' must be [x, y, z]")
        }
    }

    void checkParticle(String where, def particle) {
        if (!(particle instanceof Map) || !(particle.type instanceof String)) {
            error(where, 'particle must be an object with a "type", e.g. { "type": "minecraft:flame" }')
            return
        }
        String type = toId(particle.type.toString(), false)
        if (TINTED_PARTICLES.contains(type)) {
            checkKeys("${where} particle", particle, TINTED_PARTICLE_KEYS)
            checkNumber("${where} particle", particle, 'scale', false, 0.01, 64)
            checkNumber("${where} particle", particle, 'lifetime', false, 1, 1200)
        } else if (isOurs(type)) {
            error(where, "unknown particle '${type}' (${TINTED_PARTICLES.join(', ')})")
        }
    }

    void checkTarget(String where, def target) {
        if (target instanceof String) {
            if (!NAMED_TARGETS.contains(target)) error(where, "unknown target '${target}' (self, owner, target, {area}, {line})")
            return
        }
        if (target instanceof Map) {
            if (target.containsKey('area')) {
                checkKeys(where, target, ['area'] as Set)
                checkNumber(where, target, 'area', true, 0)
                return
            }
            if (target.containsKey('line')) {
                checkKeys(where, target, ['line', 'width'] as Set)
                checkNumber(where, target, 'line', true, 0)
                checkNumber(where, target, 'width', false, 0)
                return
            }
        }
        error(where, 'target must be "self", "owner", "target", { "area": r } or { "line": l, "width": w }')
    }

    void checkEffects(String where, def effects) {
        if (effects == null) return
        if (!(effects instanceof List)) {
            error(where, 'must be a list of effects')
            return
        }
        effects.eachWithIndex { effect, i -> checkEffect("${where}[${i}]", effect) }
    }

    void checkEffect(String where, def effect) {
        if (!(effect instanceof Map) || !(effect.type instanceof String)) {
            error(where, 'effect needs a "type"')
            return
        }
        Map<String, Boolean> fields = EFFECTS[effect.type]
        if (fields == null) {
            error(where, "unknown effect type '${effect.type}' (${EFFECTS.keySet().join(', ')})")
            return
        }
        String at = "${where} (${effect.type})"
        checkKeys(at, effect, (fields.keySet() + 'type') as Set)
        fields.findAll { it.value && !effect.containsKey(it.key) }.each { error(at, "missing '${it.key}'") }
        if (effect.containsKey('target')) checkTarget(at, effect.target)
        if (effect.containsKey('filter')) {
            if (effect.filter instanceof Map) checkKeys("${at} filter", effect.filter, FILTER_KEYS)
            else error(at, 'filter must be an object')
        }
        if (effect.containsKey('particle')) checkParticle(at, effect.particle)
        if (effect.containsKey('trail')) checkParticle(at, effect.trail)
        if (effect.type == 'particles') checkVector(at, effect, 'spread')
        if (effect.type == 'projectile') {
            checkNumber(at, effect, 'count', false, 1)
            checkEffects("${at} on_hit", effect.on_hit)
            if (effect.containsKey('visual')) checkVisual("${at} visual", effect.visual)
        }
        if (effect.type == 'aura') {
            checkNumber(at, effect, 'duration', false, 1)
            checkNumber(at, effect, 'count', false, 1)
            checkNumber(at, effect, 'interval', false, 1)
        }
        if (effect.type == 'chain') {
            checkNumber(at, effect, 'jumps', false, 1)
            checkNumber(at, effect, 'range', false, 0)
            checkEffects("${at} on_jump", effect.on_jump)
        }
    }

    void checkVisual(String where, def visual) {
        if (!(visual instanceof Map)) {
            error(where, 'must be an object')
            return
        }
        checkKeys(where, visual, VISUAL_KEYS)
        if (!(visual.texture instanceof String)) {
            error(where, "missing 'texture'")
            return
        }
        String texture = toId(visual.texture, false)
        if (isOurs(texture) && !assetFile(texture).exists()) error(where, "texture '${texture}' does not exist")
        checkNumber(where, visual, 'size', false, 0.05, 16)
        checkNumber(where, visual, 'stretch', false, 1, 16)
    }

    Map read(File file) {
        try {
            def json = new JsonSlurper().parse(file)
            if (json instanceof Map) return json
            error(file.name, 'must be a JSON object')
        } catch (Exception e) {
            error(file.name, "invalid JSON: ${e.message}")
        }
        return null
    }

    void validateHero(File file) {
        String where = "hero/${file.name}"
        Map json = read(file)
        if (json == null) return
        checkKeys(where, json, HERO_KEYS)

        if (!(json.rank instanceof String)) error(where, "missing 'rank'")
        else if (!RANKS.contains(json.rank.toUpperCase(Locale.ROOT))) error(where, "unknown rank '${json.rank}' (${RANKS.join(', ')})")

        if (json.nature != null && !NATURES.contains(json.nature.toString().toUpperCase(Locale.ROOT))) {
            error(where, "unknown nature '${json.nature}' (${NATURES.join(', ')})")
        }

        String heroClass = toId((json['class'] ?: 'saber').toString(), true)
        if (isOurs(heroClass) && !dataFile(heroClass, 'hero_class').exists()) error(where, "class '${heroClass}' has no hero_class file")

        String ultimate = toId((json.ultimate ?: 'althera:explosion').toString(), false)
        if (isOurs(ultimate) && !dataFile(ultimate, 'ultimate').exists()) error(where, "ultimate '${ultimate}' has no ultimate file")

        ['model', 'texture', 'animations'].each { key ->
            if (json[key] == null) return
            String id = toId(json[key].toString(), false)
            if (isOurs(id) && !assetFile(id).exists()) error(where, "${key} file not found: assets/${id.replace(':', '/')}")
        }

        checkNumber(where, json, 'scale', false, 0)

        if (json.animation != null) {
            checkKeys("${where} animation", json.animation, ANIMATION_KEYS)
            ANIMATION_KEYS.each { checkNumber("${where} animation", json.animation, it, false, 0) }
        }

        if (json.sounds != null) {
            checkKeys("${where} sounds", json.sounds, SOUNDS_KEYS)
        }

        if (json.hitbox != null) {
            checkKeys("${where} hitbox", json.hitbox, HITBOX_KEYS)
            HITBOX_KEYS.each { checkNumber("${where} hitbox", json.hitbox, it, false, 0) }
        }

        if (json.stats != null) {
            checkKeys("${where} stats", json.stats, STATS_KEYS)
            STATS_KEYS.each { checkNumber("${where} stats", json.stats, it, false, 0) }
        }

        if (json.attack != null) {
            Map attack = json.attack
            String at = "${where} attack"
            checkKeys(at, attack, ATTACK_KEYS)
            if (attack.type != null && !(attack.type in ['melee', 'ranged'])) error(at, "type must be 'melee' or 'ranged'")
            checkNumber(at, attack, 'range', false, 0)
            checkNumber(at, attack, 'cooldown_ticks', false, 1)
            checkNumber(at, attack, 'shoot_frame', false, 0)
            checkNumber(at, attack, 'projectile_speed', false, 0)
            checkVector(at, attack, 'projectile_origin')
            if (attack.containsKey('projectile_trail')) checkParticle(at, attack.projectile_trail)
            checkEffects("${at} on_attack", attack.on_attack)
            checkEffects("${at} on_hit", attack.on_hit)
        }
    }

    void validateClass(File file) {
        String where = "hero_class/${file.name}"
        Map json = read(file)
        if (json == null) return
        checkKeys(where, json, CLASS_KEYS)
        ['health', 'attack', 'armor', 'speed'].each { checkNumber(where, json, it, false, 0) }
        checkNumber(where, json, 'knockback_resistance', false, 0, 1)
        checkNumber(where, json, 'dodge_chance', false, 0, 1)
        (json.strong_against ?: []).each { raw ->
            String id = toId(raw.toString(), true)
            if (isOurs(id) && !dataFile(id, 'hero_class').exists()) error(where, "strong_against '${id}' has no hero_class file")
        }
    }

    void validateUltimate(File file) {
        String where = "ultimate/${file.name}"
        Map json = read(file)
        if (json == null) return
        checkKeys(where, json, ULTIMATE_KEYS)
        checkNumber(where, json, 'mana_cost', true, 0)
        checkNumber(where, json, 'channel_ticks', true, 1)
        checkNumber(where, json, 'cooldown_ticks', false, 0)
        ['on_start', 'on_tick', 'on_end'].each { checkEffects("${where} ${it}", json[it]) }
    }

    void validateSpell(File file) {
        String where = "spell/${file.name}"
        Map json = read(file)
        if (json == null) return
        checkKeys(where, json, SPELL_KEYS)
        if (checkObject(where, json, 'player', PLAYER_SPELL_KEYS)) {
            checkNumber("${where} player", json.player, 'mana_cost', true, 1)
            checkNumber("${where} player", json.player, 'cooldown_ticks', false, 0)
            if (json.player.cast_mode != null && !CAST_MODES.contains(json.player.cast_mode)) {
                error("${where} player", "unknown cast_mode '${json.player.cast_mode}' (${CAST_MODES.join(', ')})")
            }
            if (checkObject("${where} player", json.player, 'proficiency', PROFICIENCY_KEYS)) {
                String rates = "${where} player proficiency"
                checkNumber(rates, json.player.proficiency, 'damage_per_level', false, 0, 10)
                checkNumber(rates, json.player.proficiency, 'size_per_level', false, 0, 10)
                checkNumber(rates, json.player.proficiency, 'visual_per_level', false, 0, 10)
                checkNumber(rates, json.player.proficiency, 'cost_per_level', false, 0, 0.1)
            }
        }
        checkNumber(where, json, 'range', false, 0)
        checkNumber(where, json, 'cooldown_ticks', false, 1)
        checkNumber(where, json, 'cast_ticks', false, 0)
        checkEffects("${where} on_cast", json.on_cast)
        checkEffects("${where} on_charge", json.on_charge)
    }

    void validateSpellNode(File file, Map<String, String> parents) {
        String where = "spell_node/${file.name}"
        Map json = read(file)
        if (json == null) return
        checkKeys(where, json, SPELL_NODE_KEYS)
        checkNumber(where, json, 'x', true)
        checkNumber(where, json, 'y', true)
        checkNumber(where, json, 'tier', false, 1)
        if (json.branch != null && !SPELL_BRANCHES.contains(json.branch)) error(where, "unknown branch '${json.branch}' (${SPELL_BRANCHES.join(', ')})")
        if (json.element != null && !SPELL_ELEMENTS.contains(json.element)) error(where, "unknown element '${json.element}' (${SPELL_ELEMENTS.join(', ')})")

        if (json.spell != null) {
            String spell = toId(json.spell.toString(), false)
            if (isOurs(spell)) {
                File spellFile = dataFile(spell, 'spell')
                if (!spellFile.exists()) error(where, "spell '${spell}' has no spell file")
                else if (!(read(spellFile)?.player instanceof Map)) error(where, "spell '${spell}' has no 'player' block")
            }
        }

        String id = "althera:${file.name - '.json'}".toString()
        if (json.parent == null) {
            parents[id] = null
            return
        }
        String parent = toId(json.parent.toString(), false)
        parents[id] = parent
        if (isOurs(parent) && !dataFile(parent, 'spell_node').exists()) error(where, "parent '${parent}' has no spell_node file")
    }

    void checkSpellNodeCycles(Map<String, String> parents) {
        parents.keySet().each { start ->
            Set<String> seen = [] as Set
            String current = start
            while (current != null && parents.containsKey(current)) {
                if (!seen.add(current)) {
                    error("spell_node/${start - 'althera:'}.json", 'parent chain loops back on itself')
                    return
                }
                current = parents[current]
            }
        }
    }

    boolean checkObject(String where, Map json, String key, Set<String> allowed) {
        if (!json.containsKey(key)) return false
        if (!(json[key] instanceof Map)) {
            error(where, "'${key}' must be an object")
            return false
        }
        checkKeys("${where} ${key}", json[key], allowed)
        return true
    }

    void checkIdList(String where, Map json, String key, String folder, boolean required) {
        if (!json.containsKey(key)) {
            if (required) error(where, "missing '${key}'")
            return
        }
        if (!(json[key] instanceof List)) {
            error(where, "'${key}' must be a list")
            return
        }
        if (required && json[key].isEmpty()) error(where, "'${key}' must not be empty")
        json[key].each { raw ->
            String id = toId(raw.toString(), false)
            if (isOurs(id) && !dataFile(id, folder).exists()) error(where, "${key} entry '${id}' has no ${folder} file")
        }
    }

    void validateEnemyMage(File file) {
        String where = "enemy_mage/${file.name}"
        Map json = read(file)
        if (json == null) return
        checkKeys(where, json, ENEMY_MAGE_KEYS)

        if (!(json.faction instanceof String)) error(where, "missing 'faction'")
        checkIdList(where, json, 'spells', 'spell', true)

        if (json.containsKey('targets')) {
            if (!(json.targets instanceof List) || json.targets.any { !(it instanceof String) }) {
                error(where, "'targets' must be a list of entity ids or #tags")
            }
        }

        if (checkObject(where, json, 'stats', ENEMY_STATS_KEYS)) {
            ENEMY_STATS_KEYS.each { checkNumber("${where} stats", json.stats, it, false, 0) }
            checkNumber("${where} stats", json.stats, 'knockback_resistance', false, 0, 1)
        }

        if (checkObject(where, json, 'servant', SERVANT_KEYS)) {
            Map servant = json.servant
            String at = "${where} servant"
            (servant.ranks ?: []).each { rank ->
                if (!RANKS.contains(rank.toString().toUpperCase(Locale.ROOT))) error(at, "unknown rank '${rank}' (${RANKS.join(', ')})")
            }
            checkIdList(at, servant, 'heroes', 'hero', false)
            checkNumber(at, servant, 'stat_share', false, 0)
            checkNumber(at, servant, 'damage_share', false, 0, 1)
            checkNumber(at, servant, 'recall_ticks', false, 1)
            if (checkObject(at, servant, 'spirit_regen', SPIRIT_REGEN_KEYS)) {
                checkNumber("${at} spirit_regen", servant.spirit_regen, 'amount', false, 0)
                checkNumber("${at} spirit_regen", servant.spirit_regen, 'interval_ticks', false, 1)
            }
        }

        if (json.containsKey('tiers')) {
            if (!(json.tiers instanceof List) || json.tiers.isEmpty()) {
                error(where, "'tiers' must be a non-empty list")
            } else {
                json.tiers.eachWithIndex { tier, i ->
                    String at = "${where} tiers[${i}]"
                    if (!(tier instanceof Map)) {
                        error(at, 'must be an object')
                        return
                    }
                    checkKeys(at, tier, TIER_KEYS)
                    checkNumber(at, tier, 'level', true, 1)
                    checkLootTable(at, tier)
                    if (!(tier.texture instanceof String)) {
                        error(at, "missing 'texture'")
                        return
                    }
                    String id = toId(tier.texture, false)
                    if (isOurs(id) && !assetFile(id).exists()) error(at, "texture file not found: assets/${id.replace(':', '/')}")
                }
            }
        }

        if (checkObject(where, json, 'command_seals', COMMAND_SEALS_KEYS)) {
            Map seals = json.command_seals
            String at = "${where} command_seals"
            checkNumber(at, seals, 'charges', false, 0)
            if (checkObject(at, seals, 'heal', ['health_ratio'] as Set)) checkNumber("${at} heal", seals.heal, 'health_ratio', false, 0, 1)
            if (checkObject(at, seals, 'revive', ['delay_ticks'] as Set)) checkNumber("${at} revive", seals.revive, 'delay_ticks', false, 0)
            if (checkObject(at, seals, 'overdrive', ['health_ratio', 'after_revive'] as Set)) {
                checkNumber("${at} overdrive", seals.overdrive, 'health_ratio', false, 0, 1)
                if (seals.overdrive.containsKey('after_revive') && !(seals.overdrive.after_revive instanceof Boolean)) {
                    error("${at} overdrive", "'after_revive' must be true or false")
                }
            }
        }

        if (checkObject(where, json, 'ultimate', ['health_ratio'] as Set)) checkNumber("${where} ultimate", json.ultimate, 'health_ratio', false, 0, 1)

        if (checkObject(where, json, 'home', HOME_KEYS)) {
            checkNumber("${where} home", json.home, 'radius', false, 1)
            checkNumber("${where} home", json.home, 'respawn_ticks', false, 0)
            checkNumber("${where} home", json.home, 'activation_range', false, 1)
        }

        checkLootTable(where, json)
    }

    void checkLootTable(String where, Map json) {
        if (!json.containsKey('loot_table')) return
        if (!(json.loot_table instanceof String)) {
            error(where, "'loot_table' must be a loot table id")
            return
        }
        String id = toId(json.loot_table, false)
        if (isOurs(id) && !dataFile(id, 'loot_table').exists()) error(where, "loot_table '${id}' has no loot_table file")
    }

    void validateShrine(File file) {
        String where = "worldgen/configured_feature/${file.name}"
        Map json = read(file)
        if (json == null || json.type != 'althera:noble_shrine') return
        if (!(json.config instanceof Map)) {
            error(where, "missing 'config'")
            return
        }
        checkKeys(where, json.config, ['mage'] as Set)
        if (json.config.containsKey('mage')) {
            if (!(json.config.mage instanceof String)) {
                error(where, "'mage' must be an enemy mage id")
                return
            }
            String id = toId(json.config.mage, false)
            if (isOurs(id) && !dataFile(id, 'enemy_mage').exists()) error(where, "mage '${id}' has no enemy_mage file")
        }
    }

    void validateQuest(File file) {
        String where = "academy_quest/${file.name}"
        Map json = read(file)
        if (json == null) return
        checkKeys(where, json, QUEST_KEYS)
        if (!(json.title instanceof String)) error(where, "missing 'title'")
        if (json.giver instanceof String && json.giver.startsWith('althera:') && !dataFile(json.giver, 'academy_teacher').exists()) error(where, "giver '${json.giver}' has no academy_teacher file")
        (json.requires ?: []).each { required ->
            String id = toId(required.toString(), false)
            if (isOurs(id) && !dataFile(id, 'academy_quest').exists()) error(where, "requires '${id}', which has no academy_quest file")
        }
        checkTyped("${where} task", json.tasks, QUEST_TASKS)
        checkTyped("${where} reward", json.rewards, QUEST_REWARDS)
        (json.tasks ?: []).findAll { it instanceof Map && it.type == 'spell_level' && !(it.level instanceof Number) }
                .each { error(where, "spell_level task needs a 'level'") }
        ((json.tasks ?: []) + (json.rewards ?: [])).findAll { it instanceof Map && it.node != null }.each { entry ->
            String node = toId(entry.node.toString(), false)
            if (isOurs(node) && !dataFile(node, 'spell_node').exists()) error(where, "node '${node}' has no spell_node file")
        }
    }

    void validateTeacher(File file) {
        String where = "academy_teacher/${file.name}"
        Map json = read(file)
        if (json == null) return
        checkKeys(where, json, TEACHER_KEYS)
        if (!(json.name instanceof String)) error(where, "missing 'name'")
        if (!(json.position instanceof List) || json.position.size() != 3) error(where, "'position' must be [x, y, z]")
        if (json.texture == null) {
            error(where, "missing 'texture'")
        } else {
            String texture = toId(json.texture.toString(), false)
            if (isOurs(texture) && !new File(resources, "assets/althera/${texture - 'althera:'}").exists()) error(where, "texture '${texture}' does not exist")
        }
    }

    void checkTyped(String where, Object list, Map<String, Set<String>> types) {
        if (list == null) return
        if (!(list instanceof List)) {
            error(where, 'must be a list')
            return
        }
        list.each { entry ->
            if (!(entry instanceof Map) || !types.containsKey(entry.type)) {
                error(where, "unknown type '${entry instanceof Map ? entry.type : entry}' (${types.keySet().join(', ')})")
                return
            }
            Set<String> allowed = (types[entry.type] + ['type']) as Set
            entry.keySet().findAll { !allowed.contains(it) }.each { error(where, "'${entry.type}' has an unknown field '${it}'") }
        }
    }

    List<String> run() {
        File data = new File(resources, 'data/althera')
        new File(data, 'hero_class').listFiles({ it.name.endsWith('.json') } as FileFilter)?.sort()?.each { validateClass(it) }
        new File(data, 'ultimate').listFiles({ it.name.endsWith('.json') } as FileFilter)?.sort()?.each { validateUltimate(it) }
        new File(data, 'hero').listFiles({ it.name.endsWith('.json') } as FileFilter)?.sort()?.each { validateHero(it) }
        new File(data, 'spell').listFiles({ it.name.endsWith('.json') } as FileFilter)?.sort()?.each { validateSpell(it) }
        Map<String, String> spellParents = [:]
        new File(data, 'spell_node').listFiles({ it.name.endsWith('.json') } as FileFilter)?.sort()?.each { validateSpellNode(it, spellParents) }
        checkSpellNodeCycles(spellParents)
        new File(data, 'enemy_mage').listFiles({ it.name.endsWith('.json') } as FileFilter)?.sort()?.each { validateEnemyMage(it) }
        new File(data, 'academy_quest').listFiles({ it.name.endsWith('.json') } as FileFilter)?.sort()?.each { validateQuest(it) }
        new File(data, 'academy_teacher').listFiles({ it.name.endsWith('.json') } as FileFilter)?.sort()?.each { validateTeacher(it) }
        new File(data, 'worldgen/configured_feature').listFiles({ it.name.endsWith('.json') } as FileFilter)?.sort()?.each { validateShrine(it) }
        return errors
    }
}

tasks.register('validateData') {
    group = 'verification'
    description = 'Checks the hero, hero class, ultimate, spell, spell node, enemy mage and shrine JSON files for typos and broken references.'
    def resources = file('src/main/resources')
    inputs.dir(resources)
    doLast {
        def errors = new DataValidator(resources).run()
        if (!errors.isEmpty()) {
            throw new GradleException("Invalid data files:\n - " + errors.join('\n - '))
        }
        logger.lifecycle('Data files OK')
    }
}

tasks.named('check') {
    dependsOn 'validateData'
}
