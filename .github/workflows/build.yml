name: Build

# Pushes to master build the merged result; pull requests build each update of the PR branch.
# Feature branch pushes without an open PR do not build, which avoids duplicate runs.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A newer commit on the same branch/PR cancels the build still running for the previous one.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build